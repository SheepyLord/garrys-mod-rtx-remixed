// ============================================================
// RTX stack required settings (from fixes package nightly-6d2e2b9)
// r_shadows 0 is CRITICAL: with shadows on, NPC spawn corrupts the
// engine shadow-decal list -> infinite loop in CShadowMgr::RenderShadowList
// (root cause of the 2026-08-09 NPC-spawn hang, see hangdump 033119)
// ============================================================
sv_cheats 1
mat_disable_d3d9ex 1
r_3dsky 0
r_WaterDrawReflection 0
r_WaterDrawRefraction 0
r_shadows 0
r_unloadlightmaps 1
r_forcehwskin 0
r_hwskin_force_flag 0
r_eyes_hwskin 0
mat_specular 0
mat_bumpmap 0
mat_normalmap 0
mat_parallaxmap 0
r_staticprop_lod 0
r_lod 0
gmod_mcore_test 1
r_radiosity 4
r_threaded_particles 0
r_entityclips 0
cl_brushfastpath 0
cl_tlucfastpath 0
cl_modelfastpath 0
mat_softwarelighting 0
mat_softwareskin 1
mat_frame_sync_enable 0
mat_fastnobump 1
mat_displacementmap 0
mat_drawflat 0
mat_normalmaps 0
mat_normals 0
r_frustumcullworld 0
r_occlusion 0
r_novis 1
// ============================================================
// Personal settings (from previous autoexec.cfg, backed up as
// autoexec.cfg.user-backup-20260809) + r_forcehwlight from launcher options
// ============================================================
r_forcehwlight 1
cl_threaded_bone_setup 1
cl_threaded_client_leaf_system 1
sv_playerragdolls 1
cl_autohelp 0
sv_gravity 515
r_flashlightfov 100
r_flashlightlinear 24
air_density 1.25
physgun_drawbeams 0
r_drawdecals 1
r_drawmodeldecals 0
jpeg_quality 100
sv_pause_sp 0
sv_crazyphysics_remove 0
sv_crazyphysics_defuse 0

// Astra RTX map compatibility (retained original autoexec in deployment backup).
exec astra_importer_compat
